<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BidHub Account Summary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0663ef",
            "background-light": "#f5f7f8",
            "background-dark": "#0f1723",
          },
          fontFamily: {
            "display": ["Inter"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200">
<div class="flex flex-col min-h-screen">
<header class="p-4 flex items-center justify-between sticky top-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<button class="p-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-lg font-bold">Account Summary</h1>
<button class="p-2">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<main class="flex-grow p-4 space-y-6">
<div>
<div class="flex justify-between items-center mb-1">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Step 4 of 4</span>
</div>
<div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
<div class="bg-primary h-2 rounded-full" style="width: 100%"></div>
</div>
</div>
<div class="text-center">
<h2 class="text-2xl font-bold text-slate-900 dark:text-white">Welcome to BidHub, Alex!</h2>
<p class="text-slate-600 dark:text-slate-400 mt-2">Your account is all set up. Here's a summary of your details:</p>
</div>
<div class="space-y-4">
<div class="flex items-center gap-4 p-4 rounded-lg bg-white dark:bg-slate-800/50">
<div class="bg-primary/10 dark:bg-primary/20 text-primary p-3 rounded-full">
<span class="material-symbols-outlined">person</span>
</div>
<div class="flex-1">
<p class="font-medium text-slate-700 dark:text-slate-300">Alias</p>
<p class="text-slate-500 dark:text-slate-400">@alex_bids</p>
</div>
</div>
<div class="flex items-center gap-4 p-4 rounded-lg bg-white dark:bg-slate-800/50">
<div class="bg-primary/10 dark:bg-primary/20 text-primary p-3 rounded-full">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<div class="flex-1">
<p class="font-medium text-slate-700 dark:text-slate-300">Credit Balance</p>
<p class="text-slate-500 dark:text-slate-400">$0.00</p>
</div>
</div>
</div>
<div class="space-y-4">
<h3 class="text-lg font-bold text-slate-900 dark:text-white">Interests</h3>
<div class="flex flex-wrap gap-2">
<span class="bg-primary/10 dark:bg-primary/20 text-primary text-sm font-medium px-3 py-1 rounded-full">Electronics</span>
<span class="bg-primary/10 dark:bg-primary/20 text-primary text-sm font-medium px-3 py-1 rounded-full">Collectibles</span>
<span class="bg-primary/10 dark:bg-primary/20 text-primary text-sm font-medium px-3 py-1 rounded-full">Art</span>
</div>
</div>
<div class="space-y-4">
<h3 class="text-lg font-bold text-slate-900 dark:text-white">Notifications</h3>
<div class="flex justify-between items-center p-4 rounded-lg bg-white dark:bg-slate-800/50">
<span class="font-medium text-slate-700 dark:text-slate-300">Email Notifications</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 dark:bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white dark:peer-checked:after:border-slate-800 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-slate-300 dark:after:border-slate-600 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<div class="flex justify-between items-center p-4 rounded-lg bg-white dark:bg-slate-800/50">
<span class="font-medium text-slate-700 dark:text-slate-300">Push Notifications</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 dark:bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white dark:peer-checked:after:border-slate-800 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-slate-300 dark:after:border-slate-600 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</main>
<footer class="p-4 sticky bottom-0 bg-background-light dark:bg-background-dark">
<button class="w-full bg-primary text-white font-bold py-3 px-5 rounded-xl shadow-lg shadow-primary/30">
        Start Bidding
      </button>
</footer>
</div>

</body></html>
