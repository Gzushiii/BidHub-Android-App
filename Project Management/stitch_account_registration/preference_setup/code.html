<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BidHub Mobile Bidding Platform</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0663ef",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1723",
                        "content-light": "#0d131c",
                        "content-dark": "#f5f7f8",
                        "subtle-light": "#ced9e9",
                        "subtle-dark": "#2d3748"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .custom-checkbox:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-content-light dark:text-content-dark">
<div class="flex flex-col min-h-screen">
<header class="sticky top-0 z-10 bg-background-light dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex items-center justify-between p-4">
<button class="p-2 -ml-2">
<svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
</svg>
</button>
<h1 class="text-lg font-bold">Personalize</h1>
<button class="text-sm font-medium text-primary">Skip</button>
</div>
</header>
<main class="flex-grow px-4 pb-6">
<div class="my-4">
<div class="flex justify-between items-center mb-2">
<p class="text-sm font-medium">Step 1 of 4</p>
</div>
<div class="w-full bg-subtle-light dark:bg-subtle-dark rounded-full h-2">
<div class="bg-primary h-2 rounded-full" style="width: 25%"></div>
</div>
</div>
<div class="pt-6">
<h2 class="text-2xl font-bold tracking-tight">What are you interested in?</h2>
<p class="mt-1 text-content-light/70 dark:text-content-dark/70">Select the categories you'd like to bid on.</p>
</div>
<div class="space-y-1 mt-6 border-y border-subtle-light dark:border-subtle-dark">
<label class="flex items-center justify-between py-4">
<span class="font-medium">Electronics</span>
<input checked="" class="custom-checkbox h-5 w-5 rounded-md border-2 border-subtle-light dark:border-subtle-dark bg-transparent checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark" type="checkbox"/>
</label>
<div class="h-px bg-subtle-light dark:bg-subtle-dark"></div>
<label class="flex items-center justify-between py-4">
<span class="font-medium">Fashion</span>
<input checked="" class="custom-checkbox h-5 w-5 rounded-md border-2 border-subtle-light dark:border-subtle-dark bg-transparent checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark" type="checkbox"/>
</label>
<div class="h-px bg-subtle-light dark:bg-subtle-dark"></div>
<label class="flex items-center justify-between py-4">
<span class="font-medium">Home &amp; Garden</span>
<input class="custom-checkbox h-5 w-5 rounded-md border-2 border-subtle-light dark:border-subtle-dark bg-transparent checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark" type="checkbox"/>
</label>
<div class="h-px bg-subtle-light dark:bg-subtle-dark"></div>
<label class="flex items-center justify-between py-4">
<span class="font-medium">Collectibles</span>
<input class="custom-checkbox h-5 w-5 rounded-md border-2 border-subtle-light dark:border-subtle-dark bg-transparent checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark" type="checkbox"/>
</label>
<div class="h-px bg-subtle-light dark:bg-subtle-dark"></div>
<label class="flex items-center justify-between py-4">
<span class="font-medium">Experiences</span>
<input class="custom-checkbox h-5 w-5 rounded-md border-2 border-subtle-light dark:border-subtle-dark bg-transparent checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark" type="checkbox"/>
</label>
</div>
<div class="pt-8">
<h2 class="text-2xl font-bold tracking-tight">Notifications</h2>
<p class="mt-1 text-content-light/70 dark:text-content-dark/70">How would you like to receive updates?</p>
</div>
<div class="space-y-1 mt-6 border-y border-subtle-light dark:border-subtle-dark">
<label class="flex items-center justify-between py-4">
<span class="font-medium">Email</span>
<input checked="" class="custom-checkbox h-5 w-5 rounded-md border-2 border-subtle-light dark:border-subtle-dark bg-transparent checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark" type="checkbox"/>
</label>
<div class="h-px bg-subtle-light dark:bg-subtle-dark"></div>
<label class="flex items-center justify-between py-4">
<span class="font-medium">Push Notifications</span>
<input class="custom-checkbox h-5 w-5 rounded-md border-2 border-subtle-light dark:border-subtle-dark bg-transparent checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark" type="checkbox"/>
</label>
</div>
</main>
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark/80 backdrop-blur-sm p-4 pb-6">
<button class="w-full bg-primary text-white font-bold py-3 px-5 rounded-lg h-12 flex items-center justify-center">
            Continue
        </button>
</footer>
</div>

</body></html>
